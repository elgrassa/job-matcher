platforms:
  linkedin:
    enabled: true
    actor_id: "harvestapi/linkedin-job-search"
    default_input:
      titles:
        # QA / Test track
        - "SDET"
        - "Senior SDET"
        - "Senior Test Automation Engineer"
        - "Test Automation Engineer"
        - "QA Engineer"
        - "Senior QA Automation Engineer"
        - "Software Engineer in Test"
        - "QA Architect"
        - "QA Lead"
        - "Head of QA"
        - "Principal QA Engineer"
        # DevSecOps / Security track
        - "DevSecOps Engineer"
        - "Security Engineer"
        - "AppSec Engineer"
        # Platform / Infra track
        - "Platform Engineer"
        - "DevOps Engineer"
        - "Infrastructure Engineer"
        - "SRE"
        # Performance track
        - "Senior Performance Engineer"
        # AI / Applied AI track (agents, RAG, evaluation — not deep ML)
        - "AI QA Engineer"
        - "AI Engineer"
        - "LLM Engineer"
        # Java backend track
        - "Senior Java Engineer"
        # Leadership track
        - "Engineering Manager QA"
      locations:
        - "Poland"
        - "Germany"
        - "Switzerland"
        - "Netherlands"
        - "Remote"
      work_type:
        - "Remote"
      posted_within_days: 3
      max_results: 150

  justjoin:
    enabled: true
    search_actor_id: "stealth_mode/justjoin-jobs-search-scraper"
    details_actor_id: "stealth_mode/justjoin-jobs-details-scraper"
    default_input:
      categories:
        - "testing"
        - "devops"
        - "ai"
        - "java"
        - "python"
      experience_levels:
        - "senior"
        - "expert"
      employment_types:
        - "b2b"
      remote_only: false
      locations:
        - "Wrocław"
        - "Warsaw"
        - "Kraków"
        - "Remote"
      max_results: 150

  nofluffjobs:
    enabled: true
    actor_id: "getdataforme/nofluffjobs-profile-scraper"
    default_input:
      search_terms:
        - "sdet"
        - "test automation"
        - "senior automation"
        - "qa engineer"
        - "qa lead"
        - "devsecops"
        - "security engineer"
        - "platform engineer"
        - "devops engineer"
        - "llm engineer"
        - "ai engineer"
        - "performance engineer"
      max_results: 150
