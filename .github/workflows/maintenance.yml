name: Maintenance

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  dep-check:
    name: Dependency health
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Verify lockfile is up to date
        run: uv lock --check
      - name: CVE scan (pip-audit)
        shell: bash
        run: |
          uv tool install pip-audit
          uv export --frozen --no-hashes > /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt

  outdated:
    name: Outdated dependencies (informational)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: job-matcher
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Show outdated packages
        run: uv tree --outdated

  security-scan:
    name: Security scan
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --frozen
      - name: bandit (Python security linter)
        run: |
          uv tool install bandit
          bandit -r src/ -ll
      - name: trufflehog (secrets scan)
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
